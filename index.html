<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#f0faf4',
              100: '#d8f3dc',
              200: '#b7e4c7',
              300: '#95d5b2',
              400: '#74c69d',
              500: '#52b788',
              600: '#40916c',
              700: '#2d6a4f',
              800: '#1b4332',
              900: '#0d2818',
            },
            destaque: {
              50: '#fff9eb',
              100: '#fff3c4',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
            },
          },
          fontFamily: {
            display: ['"DM Serif Display"', 'Georgia', 'serif'],
            body: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'marca': '0 1px 3px rgba(27,67,50,0.08), 0 4px 12px rgba(27,67,50,0.06)',
            'marca-md': '0 4px 12px rgba(27,67,50,0.10), 0 12px 32px rgba(27,67,50,0.08)',
            'marca-lg': '0 8px 24px rgba(27,67,50,0.12), 0 20px 48px rgba(27,67,50,0.10)',
          },
          borderRadius: {
            'marca': '0.5rem',
          },
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Source Sans 3', system-ui, sans-serif; background: #f8faf9; color: #1a1a2e; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #95d5b2; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #74c69d; }

    :focus-visible { outline: 2px solid #52b788; outline-offset: 2px; border-radius: 4px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    [data-tela]:not(.hidden) {
      animation: fadeIn 0.35s ease-out forwards;
    }

    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.125rem 0.625rem; border-radius: 9999px; font-size: 0.75rem;
      font-weight: 600; line-height: 1.5; letter-spacing: 0.01em;
    }
    .card {
      background: #ffffff; border-radius: 0.625rem; box-shadow: 0 1px 3px rgba(27,67,50,0.07), 0 4px 12px rgba(27,67,50,0.05);
      border: 1px solid #e8f0eb; transition: box-shadow 0.2s ease, transform 0.15s ease;
    }
    .card:hover { box-shadow: 0 4px 12px rgba(27,67,50,0.10), 0 12px 32px rgba(27,67,50,0.07); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.5rem 1.125rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.875rem;
      cursor: pointer; border: none; transition: all 0.18s ease; font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #1b4332; color: #fff; }
    .btn-primary:hover { background: #2d6a4f; }
    .btn-outline { background: transparent; color: #1b4332; border: 1.5px solid #b7e4c7; }
    .btn-outline:hover { background: #f0faf4; border-color: #52b788; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-ghost { background: transparent; color: #555; }
    .btn-ghost:hover { background: #f1f5f4; color: #1b4332; }
    .btn-sm { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .btn-lg { padding: 0.625rem 1.5rem; font-size: 1rem; }

    .nav-btn { position: relative; }
    .nav-btn.ativo { background: #1b4332; color: #fff; }
    .nav-btn.ativo::before {
      content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 60%; background: #fbbf24; border-radius: 0 2px 2px 0;
    }

    .sidebar-item { transition: background 0.15s ease, color 0.15s ease; }
    .sidebar-item:hover:not(.ativo) { background: rgba(27,67,50,0.06); color: #1b4332; }

    .toast-enter { animation: toastSlide 0.3s ease-out forwards; }
    .toast-exit { animation: toastOut 0.25s ease-in forwards; }
    @keyframes toastSlide {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(40px); }
    }

    .modal-overlay {
      background: rgba(11,30,20,0.55); backdrop-filter: blur(2px);
      animation: modalBgIn 0.2s ease-out;
    }
    @keyframes modalBgIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-card {
      animation: modalCardIn 0.25s ease-out;
    }
    @keyframes modalCardIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .tab-btn { transition: all 0.18s ease; }
    .tab-btn.ativo-tab { border-bottom: 2px solid #1b4332; color: #1b4332; font-weight: 600; }
    .tab-btn:not(.ativo-tab) { border-bottom: 2px solid transparent; color: #888; }
    .tab-btn:hover:not(.ativo-tab) { color: #555; }

    .table-row { transition: background 0.12s ease; }
    .table-row:hover { background: #f0faf4; }

    .stat-card { transition: transform 0.18s ease, box-shadow 0.18s ease; }
    .stat-card:hover { transform: translateY(-2px); }

    .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>

    <!-- Usuário -->

  <script>
    /* ============================================================
       UTILITÁRIOS GLOBAIS
       ============================================================ */

    function brl(valor) {
      return 'R$ ' + new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(valor);
    }

    function dataBR(iso) {
      if (!iso) return '—';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function agoraISO() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    let toastTimeout = null;
    function toast(mensagem, tipo) {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      const cores = {
        ok: 'border-l-4 border-emerald-500 bg-emerald-50 text-emerald-800',
        erro: 'border-l-4 border-red-500 bg-red-50 text-red-800',
        info: 'border-l-4 border-destaque-500 bg-destaque-50 text-destaque-800',
      };
      const icones = {
        ok: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        erro: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6" stroke-linecap="round"/></svg>',
        info: '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01" stroke-linecap="round"/></svg>',
      };
      el.className = `toast-enter pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-lg shadow-marca-md ${cores[tipo] || cores.info}`;
      el.innerHTML = `${icones[tipo] || icones.info}<span class="text-sm font-medium">${mensagem}</span>`;
      container.appendChild(el);
      clearTimeout(toastTimeout);
      setTimeout(() => {
        el.classList.remove('toast-enter');
        el.classList.add('toast-exit');
        setTimeout(() => el.remove(), 260);
      }, 3000);
    }

    function abrirModal(html, titulo) {
      document.getElementById('modalTitle').textContent = titulo || '';
      document.getElementById('modalBody').innerHTML = html;
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }
    function fecharModal(e) {
      if (e && e.target !== e.currentTarget) return;
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      document.getElementById('modalBody').innerHTML = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') fecharModal();
    });

    /* ============================================================
       ROTEADOR
       ============================================================ */
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0 });
    }
    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('feed-de-noticias');
    });

    /* ============================================================
       DADOS EM MEMÓRIA (compartilhados pelas telas)
       ============================================================ */
    window.AppState = {
      noticias: [
        { id: 1, titulo: 'Governo de RO anuncia investimento de R$ 120 milhões em infraestrutura de Porto Velho', fonte: 'G1 Rondônia', categoria: 'Política', status: 'publicado', data: '2026-01-15', resumo: 'Obras incluem pavimentação de 25 km de vias no bairro Nova Porto Velho.', curtidas: 342, compartilhamentos: 89 },
